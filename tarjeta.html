<style>
  :root{
    --ink:#201f1f; --cream:#FFF9F9; --paper:#ffffff;
    --coral:#f38487; --coral-deep:#e56065; --line: rgba(32,31,31,0.09);
    --font-display:'Comfortaa', sans-serif; --font-body:'Satoshi','Comfortaa',sans-serif;
  }
  *{ box-sizing:border-box; }
  body{
    margin:0; color:var(--ink); background:#F3E9E3;
    font-family:var(--font-body); -webkit-font-smoothing:antialiased;
    min-height:100vh; display:flex; align-items:center; justify-content:center;
    padding: 32px 16px;
  }

  .card{
    width:100%; max-width: 370px; border-radius: 20px;
    background: var(--paper); position:relative;
    box-shadow: 0 30px 70px rgba(32,31,31,0.14), 0 2px 6px rgba(32,31,31,0.05);
    border: 1px solid rgba(32,31,31,0.06);
    overflow:hidden;
  }
  .panel{
    position:absolute; top:0; left:0; right:0; height: 190px;
    background-image: url('assets/img/pattern_bg.png');
    background-size: 380px; background-repeat: repeat;
    opacity: 0.16;
    -webkit-mask-image: linear-gradient(to bottom, black, transparent);
    mask-image: linear-gradient(to bottom, black, transparent);
    pointer-events:none;
  }

  .card-head{ position:relative; text-align:center; padding: 40px 28px 20px; }
  .badge{ width:80px; margin:0 auto 20px; display:block; }

  .card-head h1{
    font-family:var(--font-display); font-weight:700; color:var(--ink);
    font-size:21px; margin:0 0 12px; letter-spacing:.01em; line-height:1.2;
  }
  .rule{ width:34px; height:2px; background:var(--coral); margin:0 auto 14px; border-radius:2px; }

  .role{
    font-family:var(--font-display); font-weight:700; color:var(--coral-deep);
    font-size:11px; text-transform:uppercase; letter-spacing:.1em; margin:0 0 6px;
  }
  .subrole{
    font-family:var(--font-display); font-weight:600; color: var(--ink);
    font-size:13.5px; margin:0 0 12px; opacity:.72;
  }
  .credentials{
    font-family:var(--font-body); font-weight:500;
    font-size:11.5px; color:rgba(32,31,31,.42); margin:0; line-height:1.7; letter-spacing:.01em;
  }

  .divider{ height:1px; background:var(--line); margin:0 28px; }

  .card-body{ position:relative; padding: 22px 28px 6px; }

  .btn-save{
    display:flex; align-items:center; justify-content:center; gap:10px;
    font-family:var(--font-display); font-weight:700; font-size:14px; letter-spacing:.01em;
    border-radius:14px; padding:15px 18px; text-decoration:none;
    background: var(--ink); color: var(--cream);
    transition: transform .18s ease, box-shadow .18s ease, background .18s ease;
  }
  .btn-save svg{ width:18px; height:18px; flex:none; }
  .btn-save:hover{ transform: translateY(-2px); box-shadow: 0 10px 22px rgba(32,31,31,0.22); background:#000; }

  .quick{ position:relative; padding: 6px 28px 4px; }
  .qlink{
    display:flex; align-items:center; gap:13px;
    padding:13px 1px; text-decoration:none; color: var(--ink);
    border-bottom:1px solid var(--line);
    font-family:var(--font-display); font-weight:600; font-size:14px;
    transition: color .18s ease, padding-left .18s ease;
  }
  .quick a:last-child{ border-bottom:none; }
  .qlink:hover{ color:var(--coral-deep); padding-left:6px; }
  .qlink .ic{
    width:34px; height:34px; border-radius:10px; flex:none;
    display:flex; align-items:center; justify-content:center;
    background: var(--cream); color: rgba(32,31,31,.55);
    transition: color .18s ease;
  }
  .qlink:hover .ic{ color: var(--coral-deep); }
  .qlink .ic svg{ width:17px; height:17px; }
  .qlink .txt{ flex:1; }
  .qlink .sub{ display:block; font-family:var(--font-body); font-weight:400; font-size:11.5px; color:rgba(32,31,31,.42); margin-top:1px; }
  .qlink .arrow{ margin-left:auto; width:12px; height:12px; opacity:.3; flex:none; }

  .card-foot{ position:relative; text-align:center; padding: 20px 0 26px; }
  .card-foot p{
    font-family:var(--font-display); font-size:10px; color:rgba(32,31,31,.35); margin:0;
    letter-spacing:.2em; text-transform:uppercase; font-weight:700;
  }
</style>
